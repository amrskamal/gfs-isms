  var all = document.querySelectorAll('.row');
  for (var i = 0; i < all.length; i++) {
    all[i].classList.toggle('sel', Number(all[i].getAttribute('data-id')) === row.id
                                 && all[i].getAttribute('data-table') === table);
  }
}

function stepSelection(dir) {
  if (!SEL) return;
  var list = visibleRows(SEL.table);
  var i = -1;
  list.forEach(function (r, n) { if (r.id === SEL.id) i = n; });
  var next = list[i + dir];
  if (!next) return;
  openDrawer(SEL.table, next);
  var sel = $('.row.sel');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

/* ---------------------------------------------------------------- list */
/* Evidence status is computed; everything else stores its own. */
function rowStatus(table, row) {
  var L = SCHEMA[table].list || {};
  if (L.status === '__derived') return evidenceStatus(row);
  return row[L.status || 'status'] || '';
}
function statusValues(table) {
  var L = SCHEMA[table].list || {};
  if (L.status === '__derived') return ['Current', 'Stale', 'Missing'];
  var key = L.status || 'status';
  var col = SCHEMA[table].columns.filter(function (c) { return c.key === key; })[0];
  return (col && col.options) ? col.options : [];
}
function statusLabel(v) { return v.indexOf('TODO') === 0 ? 'Yours' : v; }

function visibleRows(table) {
  var q = QUERY.toLowerCase();
  return rows(table).filter(function (r) {
    if (FILTER !== 'all' && rowStatus(table, r) !== FILTER) return false;
    if (!q) return true;
    return colKeys(table).some(function (k) { return (r[k] || '').toLowerCase().indexOf(q) >= 0; });
  });
}

function renderList(table) {
  var spec = SCHEMA[table], L = spec.list;
  var shown = visibleRows(table), all = rows(table);
  var count = function (f) { return all.filter(f).length; };

  var chipDefs = [['all', 'All', all.length]].concat(statusValues(table).map(function (v) {
    return [v, statusLabel(v), count(function (r) { return rowStatus(table, r) === v; })];
  }));
  var chips = chipDefs.map(function (c) {
    return el('button', {
      class: 'chip' + (FILTER === c[0] ? ' on' : ''),
      onclick: function () { FILTER = c[0]; renderCurrentTab(); }
    }, [el('span', { text: c[1] }), el('span', { class: 'chipn', text: String(c[2]) })]);
  });

  var searchInput = el('input', { type: 'text', placeholder: 'Search…', 'aria-label': 'Search entries' });
  searchInput.value = QUERY;
  searchInput.addEventListener('input', function () {
    var pos = searchInput.selectionStart;
    QUERY = searchInput.value;
    renderTab();
    var again = $('.search input');
    if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  });

  var bar = el('div', { class: 'listbar' }, [
    chips, el('span', { class: 'spacer' }),
    el('div', { class: 'search' }, [magnifier(), searchInput])
  ]);

  var list = el('div', { class: 'list' });

    list.appendChild(el('div', { class: 'emptyrow',
      text: QUERY ? 'Nothing matches “' + QUERY + '”.' : 'Nothing here yet.' }));
  }

  shown.forEach(function (r) {
    var rs = rowStatus(table, r);
    var tone = STATUS_TONE[rs] || 'grey';
    var raw = L.title ? r[L.title] : r[L.primary];
    var previewKey = L.title ? L.primary : (spec.columns.filter(function (c) {
      return c.type === 'textarea' && c.key !== L.primary && c.key !== L.title;
    })[0] || {}).key;
    var meta = L.secondary.map(function (k) {

    });

    list.appendChild(el('div', {
      class: 'row' + (isTodo(r) || rs === 'Missing' ? ' gap' : ''), 'data-id': r.id, 'data-table': table,
      tabindex: '0', role: 'button',
      onclick: function () { openDrawer(table, r); },
      onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDrawer(table, r); } }
    }, [
      el('div', { class: 'ref', text: r[L.ref] || '—' }),
      el('div', { class: 'main' }, [
        el('div', { class: 'ttl' + (isGap(raw) ? ' brief' : ''), text: truncate(clean(raw), 130) || '—' }),
        previewKey && r[previewKey]
          ? el('div', { class: 'prev', text: truncate(clean(r[previewKey]), 240) }) : null,
        el('div', { class: 'meta' }, meta.concat(table === 'controls' ? [readyBadge(r.ref)] : []))
      ]),

      el('div', { class: 'chevron', text: '›' })
    ]));
  });

  if (L.allowAdd !== false) {
    list.appendChild(el('div', { class: 'addrow' }, el('button', {

      onclick: function () {

        var r = safeRow(table, blank, nextId(table));
        rows(table).push(r); save();
        FILTER = 'all'; QUERY = ''; renderCurrentTab(); openDrawer(table, r);
      }
    })));
  }

  return el('div', null, [bar, list]);
}

/* ---------------------------------------------------------------- form */
function renderForm(table) {

    var g = c.group || 'Details', found = null;

/* ---------------------------------------------------------------- stats */
function renderStats() {
  var total = 0, done = 0;
  ['org_context', 'issues', 'interested_parties'].forEach(function (t) {

function exportJson() {
  var payload = JSON.stringify({
    app: 'gfs-isms', version: 1, exportedAt: new Date().toISOString(), tables: DB.tables
  }, null, 2);
  var blob = new Blob([payload], { type: 'application/json' });
  var url = URL.createObjectURL(blob);

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  toast('Exported JSON');

function importJson(file) {
  var reader = new FileReader();
  reader.onerror = function () { toast('Could not read that file', 'amber'); };
  reader.onload = function () {
    var parsed;
    try { parsed = JSON.parse(String(reader.result)); }
    catch (e) { toast('Not valid JSON', 'amber'); return; }
    var next = coerceDb(parsed);
    if (!next) { toast('No ISMS data found in that file', 'amber'); return; }
    var n = TABLE_KEYS.reduce(function (s, t) { return s + next.tables[t].length; }, 0);
    if (!window.confirm('Replace everything currently in the app with ' + n + ' records from this file?')) return;
    DB = next; save(); closeDrawer(); route();
    toast('Imported ' + n + ' records');
  };
  reader.readAsText(file);
}

/* ================================================================== evidence
   Evidence status is DERIVED, never stored. You cannot declare your own
   evidence current; the date and the review frequency decide.
   ================================================================== */
var FREQ_MONTHS = { 'Monthly': 1, 'Quarterly': 3, 'Annual': 12 };

function parseDate(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec((s || '').replace(/^\s+|\s+$/g, ''));
  if (!m) return null;
  var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return isNaN(d.getTime()) ? null : d;
}
function addMonths(d, n) { return new Date(d.getFullYear(), d.getMonth() + n, d.getDate()); }
function today() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function fmtDate(d) {
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

/* Missing = never reviewed/collected. Stale = last review + frequency is past. */
function evidenceStatus(row) {
  var d = parseDate(row.last_reviewed);
  if (!d) return 'Missing';
  var due = addMonths(d, FREQ_MONTHS[row.frequency] || 12);
  return due.getTime() < today().getTime() ? 'Stale' : 'Current';
}
function evidenceDue(row) {
  var d = parseDate(row.last_reviewed);
  return d ? fmtDate(addMonths(d, FREQ_MONTHS[row.frequency] || 12)) : '—';
}

function evidenceFor(ref) {
  return rows('evidence').filter(function (e) { return (e.control_ref || '') === ref; });
}
function auditReady(ref) {
  return evidenceFor(ref).some(function (e) { return evidenceStatus(e) === 'Current'; });
}
function inScopeControls() {
  return rows('controls').filter(function (c) { return c.applicability !== 'Excluded'; });
}

/* Highest residual risk treated by this control, for dashboard ordering. */
function riskFor(ref) {
  var best = null;
  rows('risks').forEach(function (r) {
    var linked = (r.controls || '').split(',').map(function (s) { return s.replace(/^\s+|\s+$/g, ''); });
    if (linked.indexOf(ref) < 0) return;
    var score = Number(r.residual) || 0;
    if (!best || score > best.score) best = { score: score, ref: r.ref, scenario: r.scenario };
  });
  return best;
}

function readyBadge(ref) {
  var ok = auditReady(ref);
  return el('span', { class: 'rb ' + (ok ? 'yes' : 'no'), title: ok
      ? 'At least one current evidence item'
      : 'No current evidence — this control is not audit-ready' },
    [el('span', { class: 'dot ' + (ok ? 'green' : 'amber') }),
     el('span', { text: ok ? 'Audit-ready' : 'Not ready' })]);
}

/* ================================================================== controls */
function controlDrawerExtras(control) {
  var box = el('div', { class: 'subsec' });
  var list = el('div', { class: 'evlist' });

  function paint() {
    clear(list);
    var items = evidenceFor(control.ref);
    if (!items.length) {
      list.appendChild(el('div', { class: 'evempty',
        text: 'No evidence logged. This control cannot be audit-ready until something is here.' }));
    }
    items.forEach(function (e) {
      var st = evidenceStatus(e), tone = st === 'Current' ? 'green' : (st === 'Stale' ? 'amber' : 'red');
      list.appendChild(el('div', { class: 'evrow', onclick: function () { openDrawer('evidence', e); } }, [
        el('div', { class: 'evmain' }, [
          el('div', { class: 'evttl', text: e.title || '(untitled)' }),
          el('div', { class: 'evmeta' }, [
            el('span', { class: 'mini', text: e.type || 'unclassified' }),
            el('span', { class: 'mini', text: e.frequency || 'no frequency' }),
            el('span', { class: 'mini mono', text: 'due ' + evidenceDue(e) })
          ])
        ]),
        el('div', { class: 'st ' + tone }, [el('span', { class: 'dot ' + tone }), el('span', { text: st })])
      ]));
    });
  }
  paint();

  box.appendChild(el('h4', null, [el('span', { text: 'Evidence' }), readyBadge(control.ref)]));
  box.appendChild(list);
  box.appendChild(el('button', {
    class: 'act', text: '+ Log evidence for ' + control.ref,
    onclick: function () {
      var r = safeRow('evidence', { control_ref: control.ref, frequency: 'Quarterly' }, nextId('evidence'));
      rows('evidence').push(r); save();
      openDrawer('evidence', r);
    }
  }));
  return box;
}

function pageControls() {
  var wrap = pageShell('ISO/IEC 27001:2022  ·  Annex A', 'Control Library',
    'All 93 Annex A controls in the four themes. A control is audit-ready only when it has at least one current piece of evidence behind it.');
  var tiles = el('div', { class: 'tiles' });
  wrap.appendChild(tiles);
  var scoped = inScopeControls();
  var ready = scoped.filter(function (c) { return auditReady(c.ref); }).length;
  append(tiles, [
    statTile(String(scoped.length), 'Controls in scope', 'grey'),
    statTile(String(ready), 'Audit-ready', 'green'),
    statTile(String(scoped.length - ready), 'Not evidenced', 'amber'),
    statTile(String(rows('controls').filter(function (c) { return c.applicability === 'Excluded'; }).length),
             'Excluded from SoA', 'grey')
  ]);
  append(wrap, teach('controls', true));
  mountTabs(wrap, [{ key: 'controls', label: 'All controls', render: function () { return renderList('controls'); } }]);
  wrap.appendChild(siteFooter());
}

/* ================================================================== SoA */
function pageSoa() {
  var wrap = pageShell('ISO/IEC 27001:2022  ·  Clause 6.1.3(d)', 'Statement of Applicability',
    'Generated from the control library. For every control: whether it is necessary, its status, the justification, and whether evidence actually backs it.');
  append(wrap, teach('soa', true));
  var host = el('div');
  wrap.appendChild(host);

  var missingJust = rows('controls').filter(function (c) {
    return !(c.justification || '').replace(/^\s+|\s+$/g, '') || isGap(c.justification);
  }).length;
  var tiles = el('div', { class: 'tiles' });
  append(tiles, [
    statTile(String(rows('controls').length), 'Controls stated', 'grey'),
    statTile(String(inScopeControls().length), 'Included', 'green'),
    statTile(String(rows('controls').length - inScopeControls().length), 'Excluded', 'blue'),
    statTile(String(missingJust), 'Justifications to write', 'amber')
  ]);
  wrap.insertBefore(tiles, host.previousSibling);

  var table = el('div', { class: 'soa' });
  table.appendChild(el('div', { class: 'soahead' }, [
    el('div', { text: 'Control' }), el('div', { text: 'Applicability' }),
    el('div', { text: 'Status' }), el('div', { text: 'Justification' }), el('div', { text: 'Evidence' })
  ]));
  rows('controls').forEach(function (c) {
    table.appendChild(el('div', { class: 'soarow', onclick: function () { openDrawer('controls', c); } }, [
      el('div', null, [el('div', { class: 'soaref', text: c.ref }), el('div', { class: 'soattl', text: c.title })]),
      el('div', null, el('span', { class: 'mini', text: c.applicability || '—' })),
      el('div', null, el('span', { class: 'mini', text: c.status || 'Not assessed' })),
      el('div', { class: 'soajust' + (isGap(c.justification) || !c.justification ? ' todo' : ''),
                  text: isGap(c.justification) ? 'Yours to write' : (c.justification || 'Not stated') }),
      el('div', null, readyBadge(c.ref))
    ]));
  });
  host.appendChild(table);
  wrap.appendChild(siteFooter());
}

/* ================================================================== dashboard */
function renderDashboard() {
  var box = el('div');
  var scoped = inScopeControls();
  var withEv = scoped.filter(function (c) { return evidenceFor(c.ref).length > 0; });
  var ready = scoped.filter(function (c) { return auditReady(c.ref); });
  var ev = rows('evidence');
  var stale = ev.filter(function (e) { return evidenceStatus(e) === 'Stale'; });
  var missing = ev.filter(function (e) { return evidenceStatus(e) === 'Missing'; });
  var pct = scoped.length ? Math.round(100 * withEv.length / scoped.length) : 0;
  var readyPct = scoped.length ? Math.round(100 * ready.length / scoped.length) : 0;

  var tiles = el('div', { class: 'tiles' });
  var cov = el('div', { class: 'tile progress' }, [
    el('div', { class: 'n', text: pct + '%' }),
    el('div', { class: 'k', text: 'Controls with any evidence' }),
    el('div', { class: 'track' }, el('i', { style: 'width:' + pct + '%' }))
  ]);
  var rdy = el('div', { class: 'tile progress' }, [
    el('div', { class: 'n', text: readyPct + '%' }),
    el('div', { class: 'k', text: 'Controls audit-ready' }),
    el('div', { class: 'track' }, el('i', { style: 'width:' + readyPct + '%' }))
  ]);
  append(tiles, [cov, rdy, statTile(String(stale.length), 'Stale evidence items', 'amber'),
                 statTile(String(missing.length), 'Never collected', 'red')]);
  box.appendChild(tiles);

  /* Controls with no evidence at all, worst risk first. */
  var gaps = scoped.filter(function (c) { return evidenceFor(c.ref).length === 0; })
    .map(function (c) { return { c: c, risk: riskFor(c.ref) }; })
    .sort(function (a, b) {
      var x = a.risk ? a.risk.score : -1, y = b.risk ? b.risk.score : -1;
      if (x !== y) return y - x;
      return a.c.ref.localeCompare(b.c.ref);
    });

  box.appendChild(el('h3', { class: 'secttl' },
    [el('span', { text: 'Controls with no evidence' }),
     el('span', { class: 'sectn', text: String(gaps.length) })]));
  box.appendChild(el('p', { class: 'secthint',
    text: 'Ordered by the highest residual risk each control treats, so the top of this list is where an auditor and an attacker both start. Risk scores come from the seeded register; the register itself unlocks in Session 6.' }));

  var glist = el('div', { class: 'list' });
  gaps.slice(0, 40).forEach(function (g) {
    glist.appendChild(el('div', { class: 'row' + (g.risk && g.risk.score >= 15 ? ' hot' : ''),
      onclick: (function (c) { return function () { location.hash = '#controls'; setTimeout(function () { openDrawer('controls', c); }, 80); }; })(g.c) }, [
      el('div', { class: 'ref', text: g.c.ref }),
      el('div', { class: 'main' }, [
        el('div', { class: 'ttl', text: g.c.title }),
        g.risk ? el('div', { class: 'prev', text: 'Treats ' + g.risk.ref + ' — ' + g.risk.scenario }) : null,
        el('div', { class: 'meta' }, [
          el('span', { class: 'mini', text: g.c.theme }),
          el('span', { class: 'mini', text: g.c.status || 'Not assessed' })
        ])
      ]),
      el('div', { class: 'st ' + (g.risk && g.risk.score >= 15 ? 'red' : (g.risk ? 'amber' : 'grey')) },
        [el('span', { text: g.risk ? 'residual ' + g.risk.score : 'no linked risk' })]),
      el('div', { class: 'chevron', text: '›' })
    ]));
  });
  if (gaps.length > 40) {
    glist.appendChild(el('div', { class: 'emptyrow', text: 'and ' + (gaps.length - 40) + ' more…' }));
  }
  if (!gaps.length) glist.appendChild(el('div', { class: 'emptyrow', text: 'Every in-scope control has at least one evidence item.' }));
  box.appendChild(glist);

  /* Attention list */
  var attn = stale.concat(missing);
  box.appendChild(el('h3', { class: 'secttl' },
    [el('span', { text: 'Evidence needing attention' }),
     el('span', { class: 'sectn', text: String(attn.length) })]));
  var alist = el('div', { class: 'list' });
  if (!attn.length) alist.appendChild(el('div', { class: 'emptyrow', text: 'Nothing stale or missing.' }));
  attn.forEach(function (e) {
    var st = evidenceStatus(e), tone = st === 'Stale' ? 'amber' : 'red';
    alist.appendChild(el('div', { class: 'row', onclick: function () { openDrawer('evidence', e); } }, [
      el('div', { class: 'ref', text: e.control_ref || '—' }),
      el('div', { class: 'main' }, [
        el('div', { class: 'ttl', text: e.title || '(untitled)' }),
        el('div', { class: 'prev', text: st === 'Stale'
          ? 'Last reviewed ' + e.last_reviewed + ' · ' + (e.frequency || 'annual').toLowerCase() + ' review was due ' + evidenceDue(e)
          : 'Never collected or reviewed — ' + (e.location || 'no location recorded') }),
        el('div', { class: 'meta' }, [el('span', { class: 'mini', text: e.type || '—' }),
                                      el('span', { class: 'mini', text: e.owner || 'no owner' })])
      ]),
      el('div', { class: 'st ' + tone }, [el('span', { class: 'dot ' + tone }), el('span', { text: st })]),
      el('div', { class: 'chevron', text: '›' })
    ]));
  });
  box.appendChild(alist);
  return box;
}

function pageEvidence() {
  var wrap = pageShell('ISO/IEC 27001:2022  ·  clause 8.1, 9.1, 9.2', 'Evidence Tracker',
    'What you could actually put in front of an auditor, for each control — and how much of it has gone out of date.');
  append(wrap, teach('evidence', true));
  mountTabs(wrap, [
    { key: 'dash', label: 'Dashboard', render: renderDashboard },
    { key: 'all',  label: 'All evidence', count: rows('evidence').length, render: function () { return renderList('evidence'); } }
  ]);
  wrap.appendChild(siteFooter());
}

/* ================================================================== print */
function buildReport() {
  var root = clear($('#printroot'));
  var ctx = rows('org_context')[0] || {};
  var scoped = inScopeControls();
  var ready = scoped.filter(function (c) { return auditReady(c.ref); });
  var ev = rows('evidence');
  var cnt = function (s) { return ev.filter(function (e) { return evidenceStatus(e) === s; }).length; };

  append(root, [
    el('h1', { text: 'Gulf Freight Systems — ISMS audit pack' }),
    el('p', { class: 'rmeta', text: 'Generated ' + fmtDate(today()) + ' · ISO/IEC 27001:2022 · Fictional training data, not a real ISMS' }),

    el('h2', { text: '1. Scope' }),
    el('p', { text: ctx.scope_statement || '(not written)' }),
    el('table', { class: 'rt' }, [
      el('tr', null, [el('th', { text: 'Approved by' }), el('td', { text: ctx.approved_by || '—' })]),
      el('tr', null, [el('th', { text: 'Approval date' }), el('td', { text: ctx.approved_date || '—' })]),
      el('tr', null, [el('th', { text: 'Version' }), el('td', { text: ctx.version || '—' })])
    ]),

    el('h2', { text: '2. Evidence position' }),
    el('table', { class: 'rt' }, [
      el('tr', null, [el('th', { text: 'Controls in scope' }), el('td', { text: String(scoped.length) })]),
      el('tr', null, [el('th', { text: 'Audit-ready (current evidence)' }), el('td', { text: ready.length + ' (' + (scoped.length ? Math.round(100 * ready.length / scoped.length) : 0) + '%)' })]),
      el('tr', null, [el('th', { text: 'Evidence items held' }), el('td', { text: String(ev.length) })]),
      el('tr', null, [el('th', { text: 'Current / Stale / Never collected' }), el('td', { text: cnt('Current') + ' / ' + cnt('Stale') + ' / ' + cnt('Missing') })])
    ]),

    el('h2', { text: '3. Statement of Applicability' })
  ]);

  var soa = el('table', { class: 'rt wide' });
  soa.appendChild(el('tr', null, [el('th', { text: 'Control' }), el('th', { text: 'Applicability' }),
    el('th', { text: 'Status' }), el('th', { text: 'Audit-ready' }), el('th', { text: 'Justification' })]));
  rows('controls').forEach(function (c) {
    soa.appendChild(el('tr', null, [
      el('td', { text: c.ref + ' ' + c.title }),
      el('td', { text: c.applicability || '—' }),
      el('td', { text: c.status || 'Not assessed' }),
      el('td', { text: auditReady(c.ref) ? 'Yes' : 'No' }),
      el('td', { text: isGap(c.justification) ? '(not written)' : (c.justification || '(not stated)') })
    ]));
  });
  root.appendChild(soa);

  root.appendChild(el('h2', { text: '4. Evidence register' }));
  var et = el('table', { class: 'rt wide' });
  et.appendChild(el('tr', null, [el('th', { text: 'Control' }), el('th', { text: 'Evidence' }), el('th', { text: 'Type' }),
    el('th', { text: 'Location' }), el('th', { text: 'Owner' }), el('th', { text: 'Last reviewed' }),
    el('th', { text: 'Next due' }), el('th', { text: 'Status' })]));
  ev.slice().sort(function (a, b) { return (a.control_ref || '').localeCompare(b.control_ref || ''); })
    .forEach(function (e) {
      et.appendChild(el('tr', null, [
        el('td', { text: e.control_ref || '—' }), el('td', { text: e.title || '—' }),
        el('td', { text: e.type || '—' }), el('td', { text: e.location || '—' }),
        el('td', { text: e.owner || '—' }), el('td', { text: e.last_reviewed || 'never' }),
        el('td', { text: evidenceDue(e) }), el('td', { text: evidenceStatus(e) })
      ]));
    });
  root.appendChild(et);
  root.appendChild(el('p', { class: 'rmeta', text: 'Learning project — fictional company — no real data.' }));
}

function printReport() {
  buildReport();
  document.body.classList.add('printing');
  window.print();
  setTimeout(function () { document.body.classList.remove('printing'); }, 500);
}

/* ================================================================== shared page bits */
function pageShell(crumb, title, lede) {
  var main = clear($('#main'));
  var wrap = el('div', { class: 'wrap' });
  main.appendChild(wrap);
  wrap.appendChild(el('div', { id: 'storagebanner', class: 'banner', style: 'display:none' }));
  wrap.appendChild(el('div', { class: 'pagehead' }, [
    el('div', { class: 'crumb', text: crumb }),
    el('h2', { text: title }),
    el('p', { class: 'lede', text: lede })
  ]));
  return wrap;
}

function statTile(n, label, tone) {
  return el('div', { class: 'tile' }, [
    el('div', { class: 'n', text: n }),
    el('div', { class: 'k' }, [tone ? el('span', { class: 'dot ' + tone }) : null, el('span', { text: label })])
  ]);
}

function mountTabs(wrap, tabs) {
  VIEW.tabs = tabs;
  if (!tabs.filter(function (t) { return t.key === VIEW.current; }).length) VIEW.current = tabs[0].key;
  var bar = el('div', { class: 'tabs' }, tabs.map(function (t) {
    return el('button', {
      'data-k': t.key,
      onclick: function () { VIEW.current = t.key; FILTER = 'all'; QUERY = ''; closeDrawer(); renderCurrentTab(); }
    }, [el('span', { text: t.label }),
        typeof t.count === 'number' ? el('span', { class: 'count', text: String(t.count) }) : null]);
  }));
  VIEW.host = el('div', { id: 'tabcontent' });
  append(wrap, [bar, VIEW.host]);
  renderCurrentTab();
}

function renderCurrentTab() {
  if (!VIEW.host) return;
  var t = VIEW.tabs.filter(function (x) { return x.key === VIEW.current; })[0];
  if (!t) return;
  clear(VIEW.host);
  var btns = document.querySelectorAll('.tabs button');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-k') === VIEW.current);
  if (t.teach) append(VIEW.host, teach(t.teach, false));
  append(VIEW.host, t.render());
  if (typeof renderStats === 'function') renderStats();
}

/* Derived-status panel shown at the top of an evidence drawer. */
function evidenceBlock(row) {
  var node = el('div', { class: 'evstatus' });
  updateEvidenceBlock(node, row);
  return node;
}
function updateEvidenceBlock(node, row) {
  clear(node);
  var st = evidenceStatus(row);
  var tone = st === 'Current' ? 'green' : (st === 'Stale' ? 'amber' : 'red');
  var why = st === 'Missing'
    ? 'No last-reviewed date, so nothing has actually been collected or checked.'
    : 'Last reviewed ' + row.last_reviewed + ' · ' + (row.frequency || 'Annual').toLowerCase()
      + ' review · next due ' + evidenceDue(row) + (st === 'Stale' ? ' — overdue' : '');
  node.className = 'evstatus ' + tone;
  append(node, [
    el('div', { class: 'evstop' }, [
      el('span', { class: 'st ' + tone }, [el('span', { class: 'dot ' + tone }), el('span', { text: st })]),
      el('span', { class: 'evshint', text: 'computed, not editable' })
    ]),
    el('p', { class: 'evswhy', text: why }),
    row.control_ref ? el('p', { class: 'evswhy', text: 'Control ' + row.control_ref + ' is '
      + (auditReady(row.control_ref) ? 'audit-ready.' : 'not audit-ready.') }) : null
  ]);
}

DB = load();
buildShell();
$('#scrim').addEventListener('click', closeDrawer);
window.addEventListener('hashchange', route);
route();
save();
})();

</script>
