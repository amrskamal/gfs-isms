<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Offline ISO 27001 ISMS learning workbench for a fictional company. No network calls, no accounts, no tracking.">
<title>GFS ISMS — Gulf Freight Systems</title>
<style>
/* ============ tokens ============ */
:root{
  --bg:#0c1016; --surface:#12171f; --surface-2:#171e28; --surface-3:#1d2632;
  --border:#212a36; --border-2:#2c3846;
  --text:#e8eef5; --text-2:#9fadbd; --text-3:#68788a;
  --accent:#4b93f7; --accent-dim:#2b4a7a;
  --accent-soft:rgba(75,147,247,.13); --accent-line:#2c4a78;
  --green:#43bd8d; --green-soft:rgba(67,189,141,.12);
  --amber:#e2a44f; --amber-soft:rgba(226,164,79,.13);
  --blue:#63a5f5; --blue-soft:rgba(99,165,245,.12);
  --red:#e2716a;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  --r:10px; --r-sm:7px;
  --drawer:min(560px,46vw);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font-family:inherit}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232c38;border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#313d4c}

#app{display:flex;min-height:100vh}

/* ============ sidebar ============ */
aside{width:252px;flex:0 0 252px;background:var(--surface);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:22px 0 16px}
.brand{padding:0 20px 18px;border-bottom:1px solid var(--border);margin-bottom:14px}
.brand .mark{display:flex;align-items:center;gap:9px}
.brand .glyph{width:26px;height:26px;border-radius:7px;background:linear-gradient(140deg,#4b93f7,#2f6fd0);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;letter-spacing:-.3px}
.brand h1{margin:0;font-size:14px;font-weight:600;letter-spacing:-.1px}
.brand .sub{margin:7px 0 0;font-size:11px;color:var(--text-3);letter-spacing:.07em;text-transform:uppercase}

nav{padding:0 10px;flex:1}
nav .grouphead{padding:12px 10px 7px;font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;margin-bottom:1px;border-radius:var(--r-sm);
  color:var(--text-2);text-decoration:none;font-size:13.5px;transition:background .12s,color .12s}
nav a:hover{background:var(--surface-2);color:var(--text)}
nav a.active{background:var(--accent-soft);color:#cfe0fa;font-weight:500}
nav a.locked{color:var(--text-3)}
nav a.locked:hover{background:transparent;color:var(--text-3);cursor:default}
nav a .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav a .tag{font-size:10px;font-family:var(--mono);color:var(--text-3);flex:none}
nav a.active .tag{color:#7fa9e8}
.sidefoot{padding:14px 20px 0;border-top:1px solid var(--border);margin-top:10px;
  font-size:11px;color:var(--text-3);line-height:1.5}
.sidefoot code{font-family:var(--mono);font-size:10.5px;color:var(--text-2)}

/* ============ main ============ */
main{flex:1;min-width:0;transition:padding-right .22s ease}
.wrap{max-width:1080px;padding:30px 40px 100px}
body.drawer-open main .wrap{max-width:820px}

.pagehead{margin-bottom:22px}
.crumb{font-size:11.5px;font-family:var(--mono);color:var(--text-3);margin-bottom:7px;letter-spacing:.02em}
.pagehead h2{margin:0 0 6px;font-size:26px;font-weight:600;letter-spacing:-.35px}
.pagehead .lede{margin:0;color:var(--text-2);font-size:14.5px;max-width:68ch}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin:20px 0 24px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px}
.tile .n{font-size:23px;font-weight:600;letter-spacing:-.5px;line-height:1.15}
.tile .n small{font-size:13px;color:var(--text-3);font-weight:400;letter-spacing:0}
.tile .k{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.green{background:var(--green)} .dot.blue{background:var(--blue)}
.dot.amber{background:var(--amber)} .dot.grey{background:var(--text-3)}
.tile.progress .track{height:5px;background:#1e2733;border-radius:3px;overflow:hidden;margin-top:10px}
.tile.progress .track i{display:block;height:100%;background:linear-gradient(90deg,#3f8de8,#43bd8d);border-radius:3px;transition:width .4s}

/* teaching note */
details.teach{background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--accent);
  border-radius:var(--r);margin:0 0 20px;overflow:hidden}
details.teach>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:9px;
  font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#9dc2f5;user-select:none}
details.teach>summary::-webkit-details-marker{display:none}
details.teach>summary:hover{background:var(--surface-2)}
details.teach>summary .chev{margin-left:auto;color:var(--text-2);font-size:13px;line-height:1;transition:transform .18s}
details.teach[open]>summary .chev{transform:rotate(180deg)}
details.teach .tbody{padding:2px 18px 18px;max-width:74ch;color:#c6d3e0;font-size:14px}
details.teach .tbody p{margin:0 0 10px} details.teach .tbody p:last-child{margin-bottom:0}
details.teach .tbody ul{margin:8px 0 12px;padding-left:19px}
details.teach .tbody li{margin:5px 0}
details.teach .tbody b{color:var(--text)}
details.teach .tbody em{color:#dbe6f2}
details.teach .tbody code{font-family:var(--mono);font-size:12.5px;background:var(--surface-3);
  padding:1px 5px;border-radius:4px;color:#a9c8ef}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:22px}
.tabs button{background:none;border:none;padding:9px 13px;font-size:13.5px;color:var(--text-2);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--text);background:var(--surface)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:500}
.tabs .count{font-size:11px;font-family:var(--mono);color:var(--text-3);background:var(--surface-3);
  padding:1px 6px;border-radius:9px}
.tabs button.on .count{color:#9dc2f5;background:var(--accent-soft)}

/* ============ list ============ */
.listbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:12px;
  padding:5px 11px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.12s}
.chip:hover{border-color:var(--border-2);color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:#33517c;color:#cfe0fa}
.listbar .spacer{flex:1}
.search{position:relative}
.search input[type=text]{background:var(--surface);border:1px solid var(--border);border-radius:99px;
  color:var(--text);font-size:12.5px;padding:6px 13px 6px 33px;width:210px;outline:none}
.search input[type=text]:focus{border-color:var(--accent);box-shadow:none}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3)}

.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
  container-type:inline-size}

/* rows restack whenever the LIST is narrow — small screen, or drawer open on a laptop */
@container (max-width:620px){
  .row{grid-template-columns:auto 1fr auto;grid-template-areas:"ref . st" "main main main";
    row-gap:9px;column-gap:10px;padding:14px}
  .row .ref{grid-area:ref} .row .st{grid-area:st;padding-top:0} .row .main{grid-area:main}
  .row .chevron{display:none}
  .row .ttl{-webkit-line-clamp:3}
  .row .prev{-webkit-line-clamp:3}
}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) auto 16px;gap:14px;align-items:start;
  padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--accent-soft)}
.row.gap{box-shadow:inset 2px 0 0 var(--amber)}
.row .ref{font-family:var(--mono);font-size:11.5px;color:var(--text-3);padding-top:2px}
.row.sel .ref{color:#8fb6ea}
.row .main{min-width:0}
.row .ttl{font-size:14px;font-weight:500;color:var(--text);margin-bottom:3px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.row .prev{font-size:13px;color:var(--text-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.row .chevron{color:var(--text-3);font-size:13px;padding-top:2px;opacity:0;transition:.12s}
.row:hover .chevron,.row.sel .chevron{opacity:1}

.mini{font-size:10.5px;letter-spacing:.02em;padding:2px 8px;border-radius:99px;border:1px solid var(--border-2);
  color:var(--text-2);background:var(--surface-2);white-space:nowrap}
.mini.mono{font-family:var(--mono);font-size:10px}
.mini.gap{color:var(--amber);border-color:#5a4527;background:var(--amber-soft);font-style:italic}
.row .ttl.brief{color:var(--text-2);font-weight:400;font-style:italic}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;padding-top:2px}
.st.green{color:var(--green)} .st.blue{color:var(--blue)} .st.amber{color:var(--amber)} .st.grey{color:var(--text-3)}

.emptyrow{padding:34px 20px;text-align:center;color:var(--text-3);font-size:13.5px}
.addrow{display:flex;justify-content:center;padding:11px;border-top:1px solid var(--border);background:var(--surface-2)}

button.act{background:var(--surface-3);border:1px solid var(--border-2);color:var(--text);border-radius:var(--r-sm);
  padding:7px 13px;font-size:12.5px;cursor:pointer;transition:.12s;display:inline-flex;align-items:center;gap:6px}
button.act:hover{border-color:var(--accent);background:var(--surface-2)}
button.act.ghost{background:transparent;border-color:var(--border)}
button.act.danger:hover{border-color:var(--red);color:var(--red)}

/* ============ forms ============ */
.fieldset{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.fieldset > h3{margin:0;padding:12px 18px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-2);background:var(--surface-2);border-bottom:1px solid var(--border)}
.fieldset .fs-body{padding:18px}
.field{margin-bottom:19px;max-width:78ch}
.field:last-child{margin-bottom:0}
.field > label{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:3px}
.field .help{font-size:12px;color:var(--text-3);margin:0 0 7px;line-height:1.5}
input[type=text],textarea,select{width:100%;background:#0a0e14;color:var(--text);border:1px solid var(--border-2);
  border-radius:var(--r-sm);padding:9px 11px;font-size:13.5px;line-height:1.6;outline:none;transition:border-color .12s,box-shadow .12s}
textarea{resize:vertical;overflow:hidden;min-height:40px;white-space:pre-wrap}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{cursor:pointer;background-image:none}
.gapmark{border-color:#6b4f28!important;background:#161009!important}
.gapmark:focus{border-color:var(--amber)!important;box-shadow:0 0 0 3px var(--amber-soft)!important}
.field .gapnote{font-size:11.5px;color:var(--amber);margin-top:6px;display:flex;gap:6px;align-items:flex-start}

/* ============ drawer ============ */
#scrim{position:fixed;inset:0;background:rgba(6,9,13,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
body.drawer-open #scrim{opacity:1;pointer-events:auto}
@media(min-width:1500px){body.drawer-open #scrim{opacity:0;pointer-events:none}}

#drawer{position:fixed;top:0;right:0;height:100vh;width:var(--drawer);min-width:400px;background:var(--surface);
  border-left:1px solid var(--border);z-index:50;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.3,.8,.3,1);box-shadow:-18px 0 44px rgba(0,0,0,.35)}
body.drawer-open #drawer{transform:none}
@media(min-width:1500px){body.drawer-open main{padding-right:var(--drawer)}#drawer{box-shadow:none}}
@media(max-width:900px){#drawer{width:100vw;min-width:0}}

#drawer .dhead{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex:none}
#drawer .dhead .who{min-width:0;flex:1}
#drawer .dhead .r{font-family:var(--mono);font-size:11px;color:var(--text-3)}
#drawer .dhead h3{margin:2px 0 0;font-size:15px;font-weight:600;letter-spacing:-.1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:transparent;border:1px solid transparent;color:var(--text-3);width:28px;height:28px;
  border-radius:6px;cursor:pointer;display:grid;place-items:center;font-size:15px;line-height:1;flex:none}
.iconbtn:hover{background:var(--surface-3);color:var(--text)}
#drawer .dbody{flex:1;overflow-y:auto;padding:18px}
#drawer .dfoot{flex:none;border-top:1px solid var(--border);padding:11px 18px;display:flex;align-items:center;gap:10px;
  background:var(--surface-2);font-size:11.5px;color:var(--text-3)}
#drawer .dfoot .spacer{flex:1}
kbd{font-family:var(--mono);font-size:10px;background:var(--surface-3);border:1px solid var(--border-2);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--text-2)}

/* ============ misc ============ */
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,12px);background:#1b2330;border:1px solid var(--border-2);
  border-radius:99px;padding:8px 16px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;z-index:60;
  box-shadow:0 8px 26px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px}
#toast.show{opacity:1;transform:translate(-50%,0)}
.pagefoot{margin-top:34px;padding-top:16px;border-top:1px solid var(--border);color:var(--text-3);
  font-size:12px;max-width:74ch;line-height:1.6}
.locked-state{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:40px;text-align:center;color:var(--text-2)}
.locked-state .big{font-size:30px;margin-bottom:10px}
.locked-state h3{margin:0 0 8px;color:var(--text);font-size:17px}
.locked-state p{margin:0 auto;max-width:52ch;font-size:13.5px}

@media(max-width:640px){
  .tabs{overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;white-space:nowrap}
  .listbar .search{width:100%;order:9}
  .search input[type=text]{width:100%}
  .listbar .spacer{display:none}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .field{max-width:none}
}
@media(max-width:820px){
  #app{flex-direction:column}
  aside{width:100%;flex:none;height:auto;position:static;padding-bottom:8px}
  nav{display:flex;overflow-x:auto;gap:4px;padding:0 12px 8px}
  nav .grouphead,.sidefoot{display:none}
  nav a{white-space:nowrap}
  .wrap{padding:22px 18px 80px}
}

/* ============ offline shell additions ============ */
.datatools{padding:14px 16px 0;border-top:1px solid var(--border);margin-top:10px}
.datatools h4{margin:0 0 9px;font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.datatools .btns{display:flex;flex-wrap:wrap;gap:6px}
.datatools button{flex:1 1 auto;min-width:88px;background:var(--surface-2);border:1px solid var(--border-2);
  color:var(--text-2);border-radius:var(--r-sm);padding:6px 9px;font-size:11.5px;cursor:pointer;transition:.12s}
.datatools button:hover{border-color:var(--accent);color:var(--text)}
.datatools button.warn:hover{border-color:var(--red);color:var(--red)}
.storage{margin:10px 0 0;font-size:10.5px;line-height:1.5;color:var(--text-3);display:flex;gap:6px;align-items:flex-start}
.storage.bad{color:var(--amber)}

.banner{background:var(--amber-soft);border:1px solid #5a4527;border-radius:var(--r);
  padding:11px 14px;margin:0 0 18px;font-size:13px;color:#f0cd9a;display:flex;gap:10px;align-items:flex-start}
.banner b{color:#ffdfb0}

.sitefoot{margin-top:30px;padding:14px 0 0;border-top:1px solid var(--border);
  color:var(--text-3);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.sitefoot .badge{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--border-2);
  border-radius:99px;padding:2px 9px;color:var(--text-2)}
.sitefoot .off{color:var(--green);border-color:#23483a;background:var(--green-soft)}

/* ============ evidence / controls / SoA ============ */
.st.red{color:var(--red)} .dot.red{background:var(--red)}
.row.hot{box-shadow:inset 2px 0 0 var(--red)}

.rb{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;white-space:nowrap;
  border:1px solid var(--border-2);border-radius:99px;padding:2px 8px;background:var(--surface-2);color:var(--text-2)}
.rb.yes{color:var(--green);border-color:#23483a;background:var(--green-soft)}
.rb.no{color:var(--amber);border-color:#5a4527;background:var(--amber-soft)}

.secttl{display:flex;align-items:center;gap:9px;margin:26px 0 4px;font-size:14px;font-weight:600}
.secttl .sectn{font-family:var(--mono);font-size:11px;color:var(--text-3);
  background:var(--surface-3);border-radius:9px;padding:1px 7px}
.secthint{margin:0 0 12px;font-size:12.5px;color:var(--text-3);max-width:74ch;line-height:1.55}

/* evidence panel inside a control drawer */
.subsec{margin-top:22px;border-top:1px solid var(--border);padding-top:16px}
.subsec>h4{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);
  display:flex;align-items:center;gap:10px}
.evlist{margin-bottom:11px}
.evrow{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--border);
  border-radius:var(--r-sm);margin-bottom:6px;cursor:pointer;background:var(--surface-2);transition:.12s}
.evrow:hover{border-color:var(--accent)}
.evmain{flex:1;min-width:0}
.evttl{font-size:13px;margin-bottom:4px}
.evmeta{display:flex;flex-wrap:wrap;gap:5px}
.evempty{font-size:12.5px;color:var(--amber);background:var(--amber-soft);border:1px solid #5a4527;
  border-radius:var(--r-sm);padding:10px 12px;margin-bottom:11px;line-height:1.5}

/* computed-status panel at the top of an evidence drawer */
.evstatus{border:1px solid var(--border-2);border-left-width:3px;border-radius:var(--r-sm);
  padding:11px 13px;margin-bottom:20px;background:var(--surface-2)}
.evstatus.green{border-left-color:var(--green)}
.evstatus.amber{border-left-color:var(--amber)}
.evstatus.red{border-left-color:var(--red)}
.evstop{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.evshint{font-size:10.5px;color:var(--text-3);font-style:italic;margin-left:auto}
.evswhy{margin:0;font-size:12.5px;color:var(--text-2);line-height:1.5}
.evswhy+.evswhy{margin-top:4px}

/* SoA table */
.soa{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
  container-type:inline-size}
.soahead,.soarow{display:grid;grid-template-columns:minmax(210px,2.1fr) 110px 150px minmax(180px,2fr) 118px;
  gap:12px;padding:11px 15px;align-items:start}
.soahead{background:var(--surface-2);border-bottom:1px solid var(--border);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:600}
.soarow{border-bottom:1px solid #1c232c;cursor:pointer;font-size:12.5px}
.soarow:last-child{border-bottom:none}
.soarow:hover{background:var(--surface-2)}
.soaref{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.soattl{font-size:13px;margin-top:2px}

/* ============ printable audit pack ============ */
#printroot{display:none}
@media screen{ body.printing #printroot{display:none} }
@media print{
  @page{margin:16mm}
  #app,#drawer,#scrim,#toast{display:none!important}
  #printroot{display:block!important;background:#fff;color:#111;
    font:11pt/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #printroot h1{font-size:19pt;margin:0 0 4px}
  #printroot h2{font-size:13pt;margin:22px 0 7px;border-bottom:1px solid #999;padding-bottom:3px;
    page-break-after:avoid}
  #printroot .rmeta{color:#555;font-size:9pt;margin:0 0 14px}
  #printroot p{margin:0 0 9px}
  #printroot table.rt{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:9pt}
  #printroot table.rt th,#printroot table.rt td{border:1px solid #bbb;padding:4px 6px;
    text-align:left;vertical-align:top}
  #printroot table.rt th{background:#eee;font-weight:600;width:34%}
  #printroot table.rt.wide th{width:auto;background:#eee}
  #printroot tr{page-break-inside:avoid}
}

n_risk_note","label":"Residual risk created by the boundary","type":"textarea","help":"If OT is out of scope but shares a network with IT, say so here. Honesty in this field prevents a major nonconformity."},{"group":"Approval","key":"approved_by","label":"Approved by","type":"text"},{"group":"Approval","key":"approved_date","label":"Approval date","type":"text","placeholder":"YYYY-MM-DD"},{"group":"Approval","key":"version","label":"Document version","type":"text"}]},"issues":{"label":"Internal & External Issues","short":"Issues","clause":"ISO 27001:2022 cl. 4.1","list":{"ref":"ref","primary":"issue","secondary":["direction","category","links_to"],"status":"status","newLabel":"New issue"},"columns":[{"key":"ref","label":"Ref","type":"text","width":"70px"},{"key":"direction","label":"Internal / External","type":"select","options":["Internal","External"],"width":"130px"},{"key":"category","label":"Category","type":"select","width":"150px","options":["Political","Economic","Social","Technological","Legal & Regulatory","Environmental","Organisational","People & Culture"]},{"key":"issue","label":"Issue","type":"textarea"},{"key":"isms_implication","label":"So what? (implication for the ISMS)","type":"textarea","help":"An issue with no consequence is decoration. Every row should drive a risk, a control, or an objective."},{"key":"links_to","label":"Feeds into","type":"text","width":"140px","help":"Risk ID, control, or objective this issue justifies."},{"key":"status","label":"Status","type":"select","options":["Complete","Draft","TODO - you"],"width":"120px"}]},"interested_parties":{"label":"Interested Parties","short":"Interested parties","clause":"ISO 27001:2022 cl. 4.2","list":{"ref":"ref","title":"party","primary":"needs","secondary":["direction","requirement_type"],"status":"status","newLabel":"New party"},"columns":[{"key":"ref","label":"Ref","type":"text","width":"70px"},{"key":"party","label":"Interested party","type":"text","width":"180px"},{"key":"direction","label":"Internal / External","type":"select","options":["Internal","External"],"width":"130px"},{"key":"needs","label":"Their needs & expectations","type":"textarea"},{"key":"requirement_type","label":"Requirement type","type":"select","width":"160px","options":["Legal / Regulatory","Contractual","Expectation only","Internal mandate"],"help":"Cl. 4.2(c) asks which of these expectations you will address as ISMS requirements. 'Expectation only' means noted, not committed."},{"key":"how_addressed","label":"How the ISMS addresses it","type":"textarea"},{"key":"status","label":"Status","type":"select","options":["Complete","Draft","TODO - you"],"width":"120px"}]},"controls":{"label":"Annex A Controls","short":"Controls","clause":"ISO 27001:2022 Annex A","list":{"ref":"ref","title":"title","primary":"plain_english","secondary":["theme","applicability"],"status":"status","allowAdd":false},"columns":[{"key":"ref","label":"Control","type":"text","width":"80px"},{"key":"theme","label":"Theme","type":"select","width":"150px","options":["Organizational","People","Physical","Technological"]},{"key":"title","label":"Control name","type":"text"},{"key":"plain_english","label":"What it asks for, in plain English","type":"textarea","help":"Our paraphrase. The standard's own wording is copyrighted — read it in your copy of ISO/IEC 27001:2022."},{"key":"example_evidence","label":"Evidence that typically satisfies it","type":"textarea","help":"A starting point, not a checklist. What convinces an auditor depends on how you actually run the control."},{"key":"applicability","label":"Applicability (SoA)","type":"select","width":"130px","options":["Included","Excluded"],"help":"Cl. 6.1.3(d): the SoA must state whether each control is necessary, and justify both inclusion and exclusion."},{"key":"status","label":"Implementation status","type":"select","width":"170px","options":["Implemented","Partially implemented","Planned","Not applicable","Not assessed"]},{"key":"owner","label":"Control owner","type":"text","width":"150px"},{"key":"justification","label":"SoA justification","type":"textarea","help":"Why this control is necessary (point at a risk, a legal obligation or a contract), or why its exclusion cannot affect in-scope confidentiality, integrity or availability."}]},"evidence":{"label":"Evidence","short":"Evidence","clause":"ISO 27001:2022 cl. 8.1, 9.1, 9.2","list":{"ref":"control_ref","title":"title","primary":"description","secondary":["type","owner","location"],"status":"__derived","newLabel":"Log evidence"},"columns":[{"key":"control_ref","label":"Control","type":"select","width":"90px","options":["A.5.1","A.5.2","A.5.3","A.5.4","A.5.5","A.5.6","A.5.7","A.5.8","A.5.9","A.5.10","A.5.11","A.5.12","A.5.13","A.5.14","A.5.15","A.5.16","A.5.17","A.5.18","A.5.19","A.5.20","A.5.21","A.5.22","A.5.23","A.5.24","A.5.25","A.5.26","A.5.27","A.5.28","A.5.29","A.5.30","A.5.31","A.5.32","A.5.33","A.5.34","A.5.35","A.5.36","A.5.37","A.6.1","A.6.2","A.6.3","A.6.4","A.6.5","A.6.6","A.6.7","A.6.8","A.7.1","A.7.2","A.7.3","A.7.4","A.7.5","A.7.6","A.7.7","A.7.8","A.7.9","A.7.10","A.7.11","A.7.12","A.7.13","A.7.14","A.8.1","A.8.2","A.8.3","A.8.4","A.8.5","A.8.6","A.8.7","A.8.8","A.8.9","A.8.10","A.8.11","A.8.12","A.8.13","A.8.14","A.8.15","A.8.16","A.8.17","A.8.18","A.8.19","A.8.20","A.8.21","A.8.22","A.8.23","A.8.24","A.8.25","A.8.26","A.8.27","A.8.28","A.8.29","A.8.30","A.8.31","A.8.32","A.8.33","A.8.34"],"help":"Which Annex A control this evidence supports."},{"key":"title","label":"Evidence title","type":"text","help":"Name the artefact, not the intention. 'Q3 access review — file shares', not 'we do access reviews'."},{"key":"type","label":"Type","type":"select","width":"140px","options":["Policy","Procedure","Record","Screenshot","Log","Ticket","Interview","Demonstration"],"help":"Policy says what should happen. Record proves it did. Demonstration shows it happening now. Auditors want the second and third."},{"key":"description","label":"What it shows","type":"textarea","help":"What an auditor would conclude from it — and honestly, what it does not cover."},{"key":"location","label":"Where it lives","type":"text","help":"A path someone else could follow without you, e.g. 'SharePoint > ISMS > 05 Evidence > IAM'."},{"key":"owner","label":"Owner","type":"text","width":"150px","help":"The person who produces and refreshes it, not the person who filed it once."},{"key":"date_collected","label":"Date collected","type":"text","width":"120px","placeholder":"YYYY-MM-DD"},{"key":"frequency","label":"Review frequency","type":"select","width":"130px","options":["Monthly","Quarterly","Annual"],"help":"How often this evidence must be refreshed to stay meaningful."},{"key":"last_reviewed","label":"Last reviewed","type":"text","width":"120px","placeholder":"YYYY-MM-DD","help":"Leave blank if it has never actually been collected — the tracker will show it as Missing rather than pretending."}]},"risks":{"label":"Risk linkage","short":"Risks","clause":"ISO 27001:2022 cl. 6.1.2 (register built in Session 6)","hidden":true,"list":{"ref":"ref","title":"scenario","primary":"scenario","secondary":["controls"],"status":"status"},"columns":[{"key":"ref","label":"Risk","type":"text","width":"70px"},{"key":"scenario","label":"Risk scenario","type":"textarea"},{"key":"residual","label":"Residual score","type":"text","width":"110px"},{"key":"controls","label":"Controls treating it","type":"text"},{"key":"status","label":"Status","type":"select","options":["Seeded","Draft","TODO - you"],"width":"110px"}]}};
var SEED   = {"org_context":[{"id":1,"org_name":"Gulf Freight Systems LLC","org_description":"Gulf Freight Systems (GFS) is a 250-person third-party logistics operator headquartered in Mussafah, Abu Dhabi, with a bonded warehouse in KIZAD and a small office in Jebel Ali. GFS provides freight forwarding, customs clearance, bonded and ambient warehousing, and last-mile distribution for industrial, retail and pharmaceutical clients across the GCC. Roughly 30% of revenue comes from European shippers moving goods into the UAE. Customers book and track shipments through the GFS Customer Portal; warehouse operations run on an automated conveyor and ASRS control system supplied and remotely supported by a European vendor.","business_context":"Three drivers: (1) two European customers now require ISO 27001 certification as a condition of contract renewal in Q3; (2) a 2025 ransomware incident at a regional competitor stopped warehouse operations for nine days and prompted the board to ask what GFS's exposure is; (3) GFS processes personal data of EU data subjects (consignee contact details) and needs a defensible position under both UAE PDPL and GDPR.","scope_statement":"The Information Security Management System covers the provision of freight forwarding, customs clearance, bonded and ambient warehousing, and distribution services to GFS customers, including the GFS Customer Portal and the supporting Microsoft 365 and Microsoft Azure environments, delivered from the Mussafah head office and the KIZAD warehouse facility. [GAP - YOU: decide whether the warehouse control system (OT) is inside this sentence, and rewrite the sentence so a certification body can print it on a certificate.]","scope_in":"- Freight forwarding and customs clearance operations (Mussafah HQ)\n- Bonded and ambient warehousing and distribution (KIZAD)\n- GFS Customer Portal (web application + API), hosted in Azure UAE North\n- Microsoft 365 tenant (Exchange Online, SharePoint, Teams, Entra ID)\n- Corporate IT network, endpoints and the IT service desk\n- All GFS employees and contractors at the two in-scope sites\n- HR, Finance and Procurement processes to the extent they support the above","scope_out":"- Jebel Ali sales office (5 staff, no data processing beyond email)   <-- is this defensible?\n- [GAP - YOU: list anything else you intend to exclude and be ready to defend it]","scope_out_justification":"[GAP - YOU: cl. 4.3 lets you exclude organisational units, but only if you can show the exclusion cannot affect the confidentiality, integrity or availability of what is in scope. The Jebel Ali office uses the same Microsoft 365 tenant and the same Entra ID directory. Write the honest justification -- or change the scope.]","interfaces":"- Microsoft (Azure + M365): infrastructure and platform under a shared responsibility model; GFS retains identity, configuration, data and access management.\n- Warehouse control system vendor (Netherlands): supplies the ASRS/conveyor control software and holds a permanent remote-support VPN into the KIZAD OT segment.\n- UAE Federal Customs / port community systems: EDI declarations submitted from the forwarding application; GFS controls its own credentials and message content only.\n- Customers: portal accounts, EDI feeds, and shipment data received under contract.\n- Outsourced last-mile subcontractors: receive consignee name, address and phone.\n- [GAP - YOU: add the managed IT support provider and state where their responsibility ends.]","locations":"- Mussafah, Abu Dhabi: head office, ~140 staff, main comms room\n- KIZAD, Abu Dhabi: warehouse, ~100 staff, OT control room and plant network\n- Jebel Ali, Dubai: sales office, 5 staff (currently proposed out of scope)\n- Azure UAE North region: Customer Portal and databases\n- Microsoft 365 tenant: data at rest in UAE / EU per service","technologies":"- Microsoft 365 (Entra ID, Exchange Online, SharePoint, Teams, Intune)\n- Microsoft Azure (App Service, Azure SQL, Storage, Front Door)\n- GFS Customer Portal (.NET, customer-facing, internet-exposed)\n- Freight forwarding / WMS application (vendor-hosted SaaS)\n- Warehouse control system: PLCs, SCADA HMI, ASRS controllers (flat OT network)\n- Handheld barcode terminals, site CCTV, badge access system","exclusion_risk_note":"[GAP - YOU: this is the field that separates a real scope from a paper one. The OT network at KIZAD currently shares VLANs and a domain controller with corporate IT, and the vendor's remote access lands inside it. Write two or three sentences describing what that means for any boundary you draw.]","approved_by":"","approved_date":"","version":"0.1 (draft)"}],"issues":[{"id":1,"ref":"EXT-01","direction":"External","category":"Legal & Regulatory","issue":"UAE Federal Decree-Law No. 45 of 2021 (Personal Data Protection Law) applies to personal data GFS processes about consignees, drivers and customer staff.","isms_implication":"The ISMS must be able to demonstrate lawful basis, data subject rights handling and breach notification. Drives A.5.34 and the records of processing.","links_to":"R-07 / A.5.34","status":"Complete"},{"id":2,"ref":"EXT-02","direction":"External","category":"Legal & Regulatory","issue":"EU GDPR applies extraterritorially (Art. 3(2)) to the processing of EU data subjects' data for European shippers, and cross-border transfers to the UAE need a valid mechanism (SCCs today; no EU adequacy decision for the UAE).","isms_implication":"Contracts with EU customers need Art. 28 processor terms and SCCs. Drives supplier and contract controls, and an obligation to support customer audits.","links_to":"R-12 / A.5.19-5.22","status":"Complete"},{"id":3,"ref":"EXT-03","direction":"External","category":"Legal & Regulatory","issue":"UAE Information Assurance Regulation (NESA/SIA) expectations flow down from semi-government customers in the energy and ports sectors, even where GFS is not itself designated critical infrastructure.","isms_implication":"Customer tenders map their questions to IA controls. ISO 27001 Annex A can be cross-mapped rather than run as a second programme.","links_to":"[YOU]","status":"Draft"},{"id":4,"ref":"EXT-04","direction":"External","category":"Technological","issue":"Ransomware targeting logistics and port operators in the region has moved from IT to OT, with attackers stopping physical movement of goods to force payment.","isms_implication":"Availability of the warehouse control system becomes a top-tier risk, not an IT annoyance. Drives backup, segmentation and continuity requirements.","links_to":"R-01, R-02","status":"Complete"},{"id":5,"ref":"EXT-05","direction":"External","category":"Economic","issue":"Customer contracts carry service credits for late delivery; margins on forwarding are thin (single-digit %).","isms_implication":"Security spend must be argued in terms of avoided downtime and retained contracts, not fear. Shapes the risk acceptance criteria the board will approve.","links_to":"Cl. 6.1.2 criteria","status":"Complete"},{"id":6,"ref":"EXT-06","direction":"External","category":"Technological","issue":"The warehouse control system vendor holds standing remote access and controls the patch cycle for the ASRS software; GFS cannot patch independently.","isms_implication":"A material dependency GFS cannot fully control. Must be managed contractually and by monitoring, not by a control GFS operates alone.","links_to":"R-03 / A.5.19-5.22","status":"Complete"},{"id":7,"ref":"EXT-07","direction":"External","category":"Social","issue":"The UAE logistics labour market is highly mobile; warehouse and driver turnover exceeds 25% per year, and many staff share devices and workstations.","isms_implication":"Joiner/mover/leaver discipline and shared-account handling are the practical weak point, not firewalls.","links_to":"R-05 / A.5.16-5.18","status":"Complete"},{"id":8,"ref":"EXT-08","direction":"External","category":"Political","issue":"Regional geopolitical tension periodically raises the level of state-aligned hacktivist activity against UAE transport and energy-adjacent targets.","isms_implication":"Justifies threat monitoring and a documented raise-the-shields posture rather than a static baseline.","links_to":"[YOU]","status":"Draft"},{"id":9,"ref":"INT-01","direction":"Internal","category":"Organisational","issue":"There is no dedicated information security function. Security work is done by a 4-person IT team whose primary KPI is service availability.","isms_implication":"Resourcing (cl. 7.1) and role definition are the first real gaps. Without an owner, the ISMS will not survive contact with peak season.","links_to":"Cl. 5.3 / 7.1","status":"Complete"},{"id":10,"ref":"INT-02","direction":"Internal","category":"Organisational","issue":"IT and OT report to different directors (IT to the CFO, warehouse engineering to the COO) with no shared change process.","isms_implication":"Any control that crosses the IT/OT boundary needs a governance answer before a technical one. Directly affects how the scope boundary can be drawn.","links_to":"R-02","status":"Complete"},{"id":11,"ref":"INT-03","direction":"Internal","category":"Technological","issue":"The Customer Portal was built by a contractor in 2019, has no current threat model, and no security testing has been performed since go-live.","isms_implication":"Highest-likelihood route to a confidentiality breach of customer shipment data. Drives A.8.25-8.29 and a testing programme.","links_to":"R-04","status":"Complete"},{"id":12,"ref":"INT-04","direction":"Internal","category":"Technological","issue":"Backups of the WMS and portal databases run nightly to Azure, but a full restore has never been tested end to end.","isms_implication":"An untested backup is an assumption, not a control. Drives A.8.13 and the continuity exercise in cl. 8.","links_to":"R-06 / A.8.13","status":"Complete"},{"id":13,"ref":"INT-05","direction":"Internal","category":"People & Culture","issue":"Security awareness training is delivered once at induction, in English only, to a workforce where a large proportion of operational staff are not fluent English speakers.","isms_implication":"Awareness (cl. 7.3) that the audience cannot understand is not awareness. Drives language and format requirements, not just completion rates.","links_to":"R-08 / A.6.3","status":"Complete"},{"id":14,"ref":"INT-06","direction":"Internal","category":"Organisational","issue":"Executive management has committed budget but has not yet set measurable information security objectives.","isms_implication":"Cl. 5.1(b) and cl. 6.2 will both be tested at the certification audit. This is a known open item.","links_to":"Cl. 6.2","status":"Draft"},{"id":15,"ref":"INT-07","direction":"Internal","category":"Technological","issue":"[YOU: describe the state of privileged access on the corporate domain and in Azure. Who holds Global Administrator? Are there shared admin accounts?]","isms_implication":"[YOU: what does it imply for the ISMS?]","links_to":"","status":"TODO - you"},{"id":16,"ref":"INT-08","direction":"Internal","category":"Organisational","issue":"[YOU: describe how change is managed today across IT. Is there a CAB, a ticketing tool, or informal WhatsApp approval?]","isms_implication":"[YOU]","links_to":"","status":"TODO - you"},{"id":17,"ref":"EXT-09","direction":"External","category":"Environmental","issue":"[YOU: Abu Dhabi environmental/physical factors that affect availability. Think heat, humidity, dust, power, and the comms room at Mussafah.]","isms_implication":"[YOU]","links_to":"","status":"TODO - you"},{"id":18,"ref":"EXT-10","direction":"External","category":"Economic","issue":"[YOU: what does peak season do to GFS's ability to operate security controls? When is it, and what gets skipped?]","isms_implication":"[YOU]","links_to":"","status":"TODO - you"},{"id":19,"ref":"EXT-11","direction":"External","category":"Legal & Regulatory","issue":"[YOU: find one more UAE legal instrument that bites here -- consider the cybercrime law, customs record-keeping obligations, or free-zone data rules -- and write it up.]","isms_implication":"[YOU]","links_to":"","status":"TODO - you"}],"interested_parties":[{"id":1,"ref":"IP-01","party":"European shipper customers (2 major accounts)","direction":"External","needs":"ISO 27001 certificate covering the services they buy; Art. 28 processor terms and SCCs; breach notification within 24h; right to audit; secure portal access.","requirement_type":"Contractual","how_addressed":"Certification scope must cover forwarding, warehousing and the portal. DPA signed with SCCs. Incident response procedure defines a 24h customer notification trigger.","status":"Complete"},{"id":2,"ref":"IP-02","party":"UAE Data Office / PDPL regulator","direction":"External","needs":"Lawful processing of personal data, data subject rights, breach notification, appropriate technical and organisational measures.","requirement_type":"Legal / Regulatory","how_addressed":"Records of processing maintained; privacy requirements folded into A.5.34; breach process includes a regulatory notification decision point.","status":"Complete"},{"id":3,"ref":"IP-03","party":"UAE Federal Customs / port community systems","direction":"External","needs":"Accurate and timely declarations; protection and correct use of GFS's EDI credentials; retention of customs records.","requirement_type":"Legal / Regulatory","how_addressed":"Credential handling under A.5.17; integrity of declaration data treated as a security property, not only a quality one.","status":"Complete"},{"id":4,"ref":"IP-04","party":"Warehouse control system vendor (NL)","direction":"External","needs":"Standing remote access to support the ASRS; predictable maintenance windows; clarity on who owns patching.","requirement_type":"Contractual","how_addressed":"Supplier agreement to be updated with security terms (A.5.20), access restricted and monitored, maintenance windows agreed with operations.","status":"Draft"},{"id":5,"ref":"IP-05","party":"Board of Directors / Managing Director","direction":"Internal","needs":"No operational stoppage; no contract loss; a defensible answer if a regulator or customer asks; visibility of residual risk in business terms.","requirement_type":"Internal mandate","how_addressed":"Management review pack reports risk posture, open findings and KPIs on one page. Risk acceptance criteria approved by the board.","status":"Complete"},{"id":6,"ref":"IP-06","party":"Warehouse and operations staff","direction":"Internal","needs":"Controls that do not slow down loading and picking; instructions in a language they read; not being blamed for reporting mistakes.","requirement_type":"Expectation only","how_addressed":"Awareness material translated; a no-blame reporting route; control design reviewed with the COO before rollout.","status":"Complete"},{"id":7,"ref":"IP-07","party":"IT team","direction":"Internal","needs":"Realistic workload; clear authority to say no to insecure change; tooling budget.","requirement_type":"Expectation only","how_addressed":"Roles and responsibilities documented under cl. 5.3; ISMS tasks written into objectives rather than added informally.","status":"Complete"},{"id":8,"ref":"IP-08","party":"Last-mile subcontractors","direction":"External","needs":"Enough consignee data to deliver; simple onboarding.","requirement_type":"Contractual","how_addressed":"Data minimisation in the feed provided to them; supplier security clauses; access removed on contract end.","status":"Draft"},{"id":9,"ref":"IP-09","party":"Cyber insurer","direction":"External","needs":"Evidence of MFA, backup testing, EDR coverage and an incident response plan at renewal.","requirement_type":"Contractual","how_addressed":"Insurer's control questionnaire mapped to Annex A so the same evidence serves both.","status":"Complete"},{"id":10,"ref":"IP-10","party":"Certification body (external auditor)","direction":"External","needs":"Documented information required by the standard; evidence controls operate; access to people and records during audit.","requirement_type":"Contractual","how_addressed":"Evidence is produced as a by-product of running the ISMS, not assembled before the audit.","status":"Complete"},{"id":11,"ref":"IP-11","party":"Employees (as data subjects)","direction":"Internal","needs":"[YOU: what do GFS employees legitimately expect about how their own personal data, HR records and any monitoring are handled?]","requirement_type":"","how_addressed":"[YOU]","status":"TODO - you"},{"id":12,"ref":"IP-12","party":"Microsoft (Azure / M365)","direction":"External","needs":"[YOU: what does the cloud provider expect from GFS, and what does GFS need from them? Hint: the answer is a shared responsibility model, not 'they handle security'.]","requirement_type":"","how_addressed":"[YOU]","status":"TODO - you"},{"id":13,"ref":"IP-13","party":"[YOU: name a party nobody remembers until the audit]","direction":"External","needs":"[YOU: candidates -- landlord of the KIZAD facility, the utility/DEWA-equivalent, the recruitment agency supplying warehouse labour, the shredding company]","requirement_type":"","how_addressed":"[YOU]","status":"TODO - you"},{"id":14,"ref":"IP-14","party":"[YOU: one more, your choice]","direction":"Internal","needs":"[YOU]","requirement_type":"","how_addressed":"[YOU]","status":"TODO - you"}],"controls":[{"ref":"A.5.1","theme":"Organizational","title":"Policies for information security","plain_english":"Management writes down the rules, approves them, publishes them, and reviews them on a schedule or after a significant change.","example_evidence":"Signed policy set with an approval date, a review date, and a distribution/acknowledgement record.","applicability":"Included","status":"Implemented","owner":"","justification":"Required by cl. 5.2 and by every customer questionnaire GFS answers. Included."},{"ref":"A.5.2","theme":"Organizational","title":"Information security roles and responsibilities","plain_english":"Someone is ty":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.8","theme":"Organizational","title":"Information security in project management","plain_english":"Security requirements are raised at project start, not bolted on at go-live.","example_evidence":"A project gate checklist with a security sign-off, for a real project.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.9","theme":"Organizational","title":"Inventory of information and other associated assets","plain_english":"You have a current list of what you hold and who owns each item.","example_evidence":"Asset register export with owner and classification, plus the date of the last reconciliation.","applicability":"Included","status":"Implemented","owner":"","justification":""},{"ref":"A.5.10","theme":"Organizational","title":"Acceptable use of information and other associated assets","plain_english":"People are told what they may and may not do with company information and equipment.","example_evidence":"The acceptable use policy plus acknowledgement records covering current staff.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.11","theme":"Organizational","title":"Return of assets","plain_english":"Leavers hand everything back, and you can prove it.","example_evidence":"Completed exit checklists showing laptop, badge and phone returned, for named leavers.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.12","theme":"Organizational","title":"Classification of information","plain_english":"Information is graded by how much harm its loss would cause.","example_evidence":"The classification scheme, and examples of real documents carrying a grade.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.13","theme":"Organizational","title":"Labelling of information","plain_english":"The grade is visible on the information itself, so people handle it correctly.","example_evidence":"Screenshots of labelled documents or emails, plus the labelling procedure.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.14","theme":"Organizational","title":"Information transfer","plain_english":"Sending information in or out follows rules — channels, encryption, agreements.","example_evidence":"Transfer procedure plus an example: an SFTP configuration or a signed data transfer agreement.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.15","theme":"Organizational","title":"Access control","plain_english":"Access is granted on a defined basis, not on request alone.","example_evidence":"The access control policy and an approved access request showing the business justification.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.16","theme":"Organizational","title":"Identity management","plain_english":"Every identity is unique and traceable to a person or a service.","example_evidence":"A directory export showing no unexplained shared accounts, with owners for service accounts.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.17","theme":"Organizational","title":"Authentication information","plain_english":"Passwords, keys and tokens are issued, stored and reset securely.","example_evidence":"Password/MFA policy plus the enforcement configuration and its exception list.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.18","theme":"Organizational","title":"Access rights","plain_english":"Access is granted, changed and removed as people join, move and leave, and reviewed periodically.","example_evidence":"A completed access review with the reviewer, the date, and the removals that followed.","applicability":"Included","status":"Partially implemented","owner":"","justification":""},{"ref":"A.5.19","theme":"Organizational","title":"Information security in supplier relationships","plain_english":"You decide what security you need from suppliers before you depend on them.","example_evidence":"Supplier register with risk tiers and the assessment record for a named supplier.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.20","theme":"Organizational","title":"Addressing information security within supplier agreements","plain_english":"The security requirements are actually in the contract.","example_evidence":"The executed contract or DPA showing the security clauses, not a template.","applicability":"Included","status":"Implemented","owner":"","justification":""},{"ref":"A.5.21","theme":"Organizational","title":"Managing information security in the ICT supply chain","plain_english":"You look past your direct supplier at what they depend on.","example_evidence":"Supplier's own certification or subprocessor list, reviewed and recorded.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.22","theme":"Organizational","title":"Monitoring, review and change management of supplier services","plain_english":"You check that suppliers keep delivering what they promised.","example_evidence":"Service review minutes, SLA reports, or the review of a supplier's latest audit report.","applicability":"Included","status":"Planned","owner":"","justification":""},{"ref":"A.5.23","theme":"Organizational","title":"Information security for use of cloud services","plain_english":"Cloud services are selected, configured and exited under defined rules.","example_evidence":"Cloud service register with the shared-responsibility split documented and configuration baselines.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.24","theme":"Organizational","title":"Information security incident management planning and preparation","plain_e ed","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.30","theme":"Organizational","title":"ICT readiness for business continuity","plain_english":"IT can recover within the times the business needs.","example_evidence":"RTO/RPO agreed with the business and a recovery test report measured against them.","applicability":"Included","status":"Planned","owner":"","justification":""},{"ref":"A.5.31","theme":"Organizational","title":"Legal, statutory, regulatory and contractual requirements","plain_english":"You know which laws and contract terms bind you, and where.","example_evidence":"A legal register naming each obligation, its owner and how it is met.","applicability":"Included","status":"Partially implemented","owner":"","justification":""},{"ref":"A.5.32","theme":"Organizational","title":"Intellectual property rights","plain_english":"You do not use software or content you have no right to use.","example_evidence":"Software licence inventory reconciled against installed software.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.33","theme":"Organizational","title":"Protection of records","plain_english":"Records that must be kept are kept, intact, for as long as required.","example_evidence":"Retention schedule plus evidence of protected, tamper-evident storage for a record class.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.34","theme":"Organizational","title":"Privacy and protection of PII","plain_english":"Personal data is handled according to the law that applies to it.","example_evidence":"Records of processing, a DPIA, and the data subject request log.","applicability":"Included","status":"Not assessed","owner":"","justification":"Included: GFS processes consignee personal data under UAE PDPL and, for EU shippers, GDPR."},{"ref":"A.5.35","theme":"Organizational","title":"Independent review of information security","plain_english":"Someone other than the people running security checks that it works.","example_evidence":"Internal audit report or an external assessment, with management's response.","applicability":"Included","status":"Planned","owner":"","justification":""},{"ref":"A.5.36","theme":"Organizational","title":"Compliance with policies, rules and standards for information security","plain_english":"You check that people actually follow the rules you wrote.","example_evidence":"Compliance check results — a sampled review, with findings and corrections.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.5.37","theme":"Organizational","title":"Documented operating procedures","plain_english":"The routine work is written down so it survives the person who does it.","example_evidence":"A current, versioned operating procedure and evidence it is the one being followed.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.6.1","theme":"People","title":"Screening","plain_english":"People are checked before they are given access, proportionate to the role.","example_evidence":"Screening records for recent hires, and the policy setting what is checked for which roles.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.6.2","theme":"People","title":"Terms and conditions of employment","plain_english":"Security obligations are part of the employment contract.","example_evidence":"The contract clause plus signed contracts for current staff and contractors.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.6.3","theme":"People","title":"Information security awareness, education and training","plain_english":"People know the rules, the threats, and their part in it — in a form they can absorb.","example_evidence":"Training records with completion dates, the material itself, and a measure of effect.","applicability":"Included","status":"Implemented","owner":"","justification":""},{"ref":"A.6.4","theme":"People","title":"Disciplinary process","plain_english":"There is a defined consequence for breaking the rules, and people know it exists.","example_evidence":"The documented process, communicated, plus (if any) an anonymised applied case.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.6.5","theme":"People","title":"Responsibilities after termination or change of employment","plain_english":"Obligations that outlive employment are stated and enforceable.","example_evidence":"Exit letters or contract clauses covering confidentiality after leaving.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.6.6","theme":"People","title":"Confidentiality or non-disclosure agreements","plain_english":"Confidentiality commitments are documented and current.","example_evidence":"Signed NDAs for staff, contractors and suppliers, with a review date.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.6.7","theme":"People","title":"Remote working","plain_english":"Working away from the office has defined security rules.","example_evidence":"Remote working policy plus device configuration evidence (disk encryption, VPN).","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.6.8","theme":"People","title":"Information security event reporting","plain_english":"People have an easy route to report something odd, and they use it.","example_evidence":"The reporting channel, plus a log showing reports actually arriving from staff.","applicability":"Included","status":"Partially implemented","owner":"","justification":""},{"ref":"A.7.1","theme":"Physical","title":"Physical security perimeters","plain_english":"There is a defined boundary around areas holding information.","example_evidence":"Site plan marking perimeters, plus photographs or a survey of the barriers.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.7.2","theme":"Physical","title":"Physical entry","plain_english":"Only authorised people get in, and entry is recorded.","example_evidence":"Access control list for a secure area plus badge system logs for a sample period.","applicability":"Included","status":"Implemented","owner":"","justification":""},{"ref":"A.7.3","theme":"Physical","title":"Securing offices, rooms and facilities","plain_english":"Sensitive areas are protected in proportion to what is inside them.","example_evidence":"Room security assessment and the resulting measures for the comms room.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.7.4","theme":"Physical","title":"Physical security monitoring","plain_english":"Premises are watched for unauthorised access.","example_evidence":"CCTV/alarm coverage plan, retention setting, and a record of a reviewed alert.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.7.5","theme":"Physical","title":"Protecting against physical and environmental threats","plain_english":"You have accounted for fire, flood, heat, dust and power.","example_evidence":"Environmental risk assessment plus fire suppression and cooling maintenance records.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.7.6","theme":"Physical","title":"Working in secure areas","plain_english":"There are rules for what happens inside a secure area.","example_evidence":"Secure area rules posted and acknowledged, plus a supervision or escort record.","applicability":"Included","status":"Not assessed","owner":"","justification":"[YOU: is the OT control room a 'secure area'? Your answer here has to match what you wrote in the clause 4 scope.]"},{"ref":"A.7.7","theme":"Physical","title":"Clear desk and clear screen","plain_english":"Information is not left visible or unattended.","example_evidence":"The rule, plus dated walkthrough findings and the corrections made.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.7.8","theme":"Physical","title":"Equipment siting and protection","plain_english":"Equipment is placed so it is not easily damaged, overheard or stolen.","example_evidence":"Comms room layout with rationale, plus environmental monitoring readings.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.7.9","theme":"Physical","title":"Security of assets off-premises","plain_english":"Equipment leaving the site is still protected.","example_evidence":"Asset issue log for handhelds and laptops, plus the off-site handling rules.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.7.10","theme":"Physical","title":"Storage media","plain_english":"Removable media is controlled through its whole life.","example_evidence":"Media register plus the disposal or sanitisation certificates.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.7.11","theme":"Physical","title":"Supporting utilities","plain_english":"Power, cooling and comms failures do not silently take you down.","example_evidence":"UPS and generator test records with dates and results.","applicability":"Included","status":"Partially implemented","owner":"","justification":""},{"ref":"A.7.12","theme":"Physical","title":"Cabling security","plain_english":"Power and data cabling cannot be easily tapped or damaged.","example_evidence":"Cabling survey or photographs showing protected routing and labelling.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.7.13","theme":"Physical","title":"Equipment maintenance","plain_english":"Equipment is maintained so it does not fail in a way that costs you information.","example_evidence":"Maintenance schedule and completed maintenance records for critical equipment.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.7.14","theme":"Physical","title":"Secure disposal or re-use of equipment","plain_english":"Nothing readable leaves the building on discarded equipment.","example_evidence":"Destruction or wipe certificates matched to asset tags.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.1","theme":"Technological","title":"User endpoint devices","plain_english":"Laptops, phones and handhelds are configured and protected to a standard.","example_evidence":"MDM/Intune compliance report showing encryption and policy state across the fleet.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.2","theme":"Technological","title":"Privileged access rights","plain_english":"Administrative access is restricted, justified, and reviewed.","example_evidence":"List of privileged accounts with business justification, plus the last review record.","applicability":"Included","status":"Partially implemented","owner":"","justification":""},{"ref":"A.8.3","theme":"Technological","title":"Information access restriction","plain_english":"People see only the information their role requires.","example_evidence":"Permission model for a system plus a sample check that it matches reality.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.4","theme":"Technological","title":"Access to source code","plain_english":"Source code is not readable or changeable by anyone who wants it.","example_evidence":"Repository permission export plus the branch protection settings.","applicability":"Included","status":"Not assessed","owner":"","justification":"[YOU: GFS does not develop the portal in-house any more. Decide whether A.8.4 is included, and justify it either way — remember the 2019 contractor still holds the repository.]"},{"ref":"A.8.5","theme":"Technological","title":"Secure authentication","plain_english":"Logging in is hard to fake — strong factors, sensibly enforced.","example_evidence":"MFA enforcement policy, the coverage report, and the documented exception list.","applicability":"Included","status":"Implemented","owner":"","justification":""},{"ref":"A.8.6","theme":"Technological","title":"Capacity management","plain_english":"Resources are monitored so you do not fail by simply running out.","example_evidence":"Capacity trend reports with thresholds and an example of action taken.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.7","theme":"Technological","title":"Protection against malware","plain_english":"Malicious code is prevented, detected and responded to.","example_evidence":"EDR/AV coverage report showing estate percentage and an example detection handled.","applicability":"Included","status":"Implemented","owner":"","justification":""},{"ref":"A.8.8","theme":"Technological","title":"Management of technical vulnerabilities","plain_english":"You find out about weaknesses and fix them within a defined time.","example_evidence":"Vulnerability scan reports, the remediation SLA, and evidence of closure against it.","applicability":"Included","status":"Partially implemented","owner":"","justification":""},{"ref":"A.8.9","theme":"Technological","title":"Configuration management","plain_english":"Systems are built and kept to a defined secure configuration.","example_evidence":"Hardening baselines plus a drift/compliance report against them.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.10","theme":"Technological","title":"Information deletion","plain_english":"Information is deleted when it is no longer needed or required.","example_evidence":"Deletion procedure plus a completed deletion record for a real data set.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.11","theme":"Technological","title":"Data masking","plain_english":"Sensitive data is hidden or obscured where full visibility is not needed.","example_evidence":"Masking rules in a system and evidence that non-production data is masked.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.12","theme":"Technological","title":"Data leakage prevention","plain_english":"Attempts to move information out are detected or prevented.","example_evidence":"DLP policy configuration plus a report of triggered rules and how they were handled.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.13","theme":"Technological","title":"Information backup","plain_english":"Backups exist, and you have proven you can restore from them.","example_evidence":"Backup job report plus a dated restore test naming the system, the verifier and the time taken.","applicability":"Included","status":"Partially implemented","owner":"","justification":"Included: treats R-01 and R-06. Backup exists; restore testing is the open gap."},{"ref":"A.8.14","theme":"Technological","title":"Redundancy of information processing facilities","plain_english":"Critical processing does not have a single point of failure.","example_evidence":"Architecture showing redundancy plus a failover test record.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.15","theme":"Technological","title":"Logging","plain_english":"Activity that matters is recorded and kept.","example_evidence":"Logging standard listing what is logged, retention setting, and a sample log extract.","applicability":"Included","status":"Partially implemented","owner":"","justification":""},{"ref":"A.8.16","theme":"Technological","title":"Monitoring activities","plain_english":"Someone or something is watching the logs and reacting.","example_evidence":"Alert rules, plus a triage record showing an alert being reviewed and closed.","applicability":"Included","status":"Planned","owner":"","justification":""},{"ref":"A.8.17","theme":"Technological","title":"Clock synchronization","plain_english":"System clocks agree, so logs can be correlated.","example_evidence":"NTP configuration across systems and a check showing drift within tolerance.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.18","theme":"Technological","title":"Use of privileged utility programs","plain_english":"Tools that can override controls are restricted and tracked.","example_evidence":"List of such tools, who may run them, and logs of their use.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.19","theme":"Technological","title":"Installation of software on operational systems","plain_english":"Only approved software gets installed on production systems.","example_evidence":"Change records for software installation plus an application allowlist configuration.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.20","theme":"Technological","title":"Networks security","plain_english":"Networks are designed and managed to protect what crosses them.","example_evidence":"Network diagram, firewall rule base, and evidence of the last rule review.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.21","theme":"Technological","title":"Security of network services","plain_english":"Network services carry defined security terms, whoever provides them.","example_evidence":"Service agreements with security terms, plus monitoring of delivery.","applicability":"Included","status":"Not assessed","owner":"","justification":""},{"ref":"A.8.22","theme":"Technological","title":"Segregation of networks","plain_english":"Different trust zones are actually separated, not just drawn separately.","example_evidence":"Firewall/VLAN configuration proving the IT–OT boundary, plus a validation test.", };
var GAP_RE = /\[(GAP\s*-\s*)?YOU/i;

var isGap  = function (v) { return GAP_RE.test(v || ''); };
var isTodo = function (r) { return (r.status || '').indexOf('TODO') === 0; };

/* ---------------------------------------------------------------- state */
var DB = null, TAB = 'org_context', FILTER = 'all', QUERY = '', SEL = null;
var VIEW = { tabs: [], current: '', host: null };
var storageOK = true, storageNote = '';

function clone(x) { return JSON.parse(JSON.stringify(x)); }

function colKeys(table) {
  return SCHEMA[table].columns.map(function (c) { return c.key; });
}

/* Build a row containing only known columns, all values coerced to strings.
   Used for both seeding and import, so nothing unexpected enters the model. */
function safeRow(table, raw, id) {
  var out = { id: id };
  colKeys(table).forEach(function (k) {
    var v = (raw && Object.prototype.hasOwnProperty.call(raw, k)) ? raw[k] : '';
    out[k] = (v === null || v === undefined) ? '' : String(v);
  });
  return out;
}

function freshFromSeed() {
  var tables = {};
  TABLE_KEYS.forEach(function (t) {
    tables[t] = (SEED[t] || []).map(function (r, i) { return safeRow(t, r, r.id || i + 1); });
  });
  return { version: 1, savedAt: new Date().toISOString(), tables: tables };
}

/* Accepts any parsed object and returns a valid DB, discarding anything else. */
function coerceDb(obj) {
  var src = (obj && obj.tables && typeof obj.tables === 'object') ? obj.tables : null;
  if (!src) return null;
  var tables = {}, found = 0;
  TABLE_KEYS.forEach(function (t) {
    /* A table the payload has never heard of is seeded, so data saved by an
       earlier version gains new modules instead of losing them. A table that
       is present but empty stays empty — that was the user's choice. */
    if (!Object.prototype.hasOwnProperty.call(src, t) || !Array.isArray(src[t])) {
      tables[t] = (SEED[t] || []).map(function (r, i) { return safeRow(t, r, r.id || i + 1); });
      return;
    }
    var incoming = src[t];
    if (incoming.length) found++;
    tables[t] = incoming.map(function (r, i) {
      var id = (r && typeof r.id === 'number' && isFinite(r.id)) ? r.id : i + 1;
      return safeRow(t, r, id);
    });
  });
  if (!found) return null;
  if (!tables.org_context.length) tables.org_context = [safeRow('org_context', {}, 1)];
  return { version: 1, savedAt: new Date().toISOString(), tables: tables };
}

function load() {
  var raw = null;
  try {
    raw = window.localStorage.getItem(STORE_KEY);
  } catch (e) {
    storageOK = false;
    storageNote = 'Browser storage is unavailable here, so changes last only until you close this tab. Use Export to keep your work.';
  }
  if (raw) {
    try {
      var parsed = coerceDb(JSON.parse(raw));
      if (parsed) return parsed;
    } catch (e) { /* corrupt payload: fall through to a fresh seed */ }
  }
  return freshFromSeed();
}

function save() {
  if (!DB) return;
  DB.savedAt = new Date().toISOString();
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify(DB));
    if (!storageOK) { storageOK = true; storageNote = ''; renderStorageState(); }
  } catch (e) {
    storageOK = false;
    if (!storageNote) storageNote = 'Could not save — storage is full or blocked. Your work is still on screen; export it now.';
    renderStorageState();
  }
}

function rows(table) { return DB.tables[table] || []; }
function nextId(table) {
  return rows(table).reduce(function (m, r) { return Math.max(m, r.id || 0); }, 0) + 1;
}

/* ---------------------------------------------------------------- dom helpers */
function el(tag, attrs, kids) {
  var n = document.createElement(tag), k;
  if (attrs) for (k in attrs) {
    if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
    var v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;                 // the ONLY way text enters
    else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  append(n, kids);
  return n;
}

function append(parent, kids) {
  if (kids === null || kids === undefined || kids === false) return parent;
  if (Array.isArray(kids)) { kids.forEach(function (c) { append(parent, c); }); return parent; }
  parent.appendChild(kids.nodeType ? kids : document.createTextNode(String(kids)));
  return parent;
}

function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }
var $ = function (s) { return document.querySelector(s); };

/* Teaching copy is authored data, not markup: {b:'…'} / {em:'…'} / {code:'…'} */
function inline(x) {
  if (Array.isArray(x)) {
    var f = document.createDocumentFragment();
    x.forEach(function (i) { f.appendChild(inline(i)); });
    return f;
  }
  if (x && typeof x === 'object') {
    var tag = Object.keys(x)[0];
    if (tag !== 'b' && tag !== 'em' && tag !== 'code') return document.createTextNode('');
    return el(tag, null, inline(x[tag]));
  }
  return document.createTextNode(String(x));
}

function rich(blocks) {
  return blocks.map(function (blk) {
    if (blk[0] === 'ul') {
      return el('ul', null, blk[1].map(function (item) { return el('li', null, inline(item)); }));
    }
    return el(blk[0], null, inline(blk[1]));
  });
}

function magnifier() {
  var NS = 'http://www.w3.org/2000/svg';

var toastT;
function toast(msg, tone) {
  var t = $('#toast');
  clear(t);
  append(t, [el('span', { class: 'dot ' + (tone || 'green') }), el('span', { text: msg })]);
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(function () { t.classList.remove('show'); }, 1800);
}

function autosize(ta) { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }
function truncate(s, n) { return !s ? '' : (s.length > n ? s.slice(0, n).replace(/\s+$/, '') + '…' : s); }
function clean(s) {
  return (s || '').replace(/\[(?:GAP\s*-\s*)?YOU:?\s*/gi, '').replace(/\]/g, '')
                  .replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
}

/* ---------------------------------------------------------------- inputs */
function inputFor(col, row, table, onSaved) {
  var value = row[col.key] || '', node;
  if (col.type === 'select') {
    node = el('select');
    [''].concat(col.options || []).forEach(function (o) {
      node.appendChild(el('option', { value: o, text: o || '— not set —' }));
    });
    node.value = value;
    node.addEventListener('change', function () { commit(node.value); });
  } else if (col.type === 'textarea') {
    node = el('textarea', { rows: 1, placeholder: col.placeholder || '' });
    node.value = value;
    node.addEventListener('input', function () { autosize(node); });
    node.addEventListener('blur', function () {
      if (node.value !== (row[col.key] || '')) commit(node.value);
    });
    requestAnimationFrame(function () { autosize(node); });
  } else {
    node = el('input', { type: 'text', placeholder: col.placeholder || '' });
    node.value = value;
    node.addEventListener('blur', function () {
      if (node.value !== (row[col.key] || '')) commit(node.value);
    });
  }
  if (isGap(value)) node.classList.add('gapmark');

  function commit(v) {
    row[col.key] = String(v);
    save();
    node.classList.toggle('gapmark', isGap(v));
    toast('Saved · ' + col.label);
    if (onSaved) onSaved();
  }
  return node;
}

function fieldFor(col, row, table, onSaved) {
  var f = el('div', { class: 'field' }, el('label', { text: col.label }));
  if (col.help) f.appendChild(el('p', { class: 'help', text: col.help }));
  f.appendChild(inputFor(col, row, table, onSaved));
  if (isGap(row[col.key])) {
    f.appendChild(el('div', { class: 'gapnote' },
      [el('span', { text: '◆' }), el('span', { text: 'Yours to write — the brief is in the field.' })]));
  }
  return f;
}

/* ---------------------------------------------------------------- drawer */
function closeDrawer() {
  SEL = null;
  document.body.classList.remove('drawer-open');
  var sel = document.querySelectorAll('.row.sel');
  for (var i = 0; i < sel.length; i++) sel[i].classList.remove('sel');
}

function openDrawer(table, row) {
  SEL = { table: table, id: row.id };
  var spec = SCHEMA[table], L = spec.list, d = $('#drawer');
  clear(d);

  ]);

  function refresh() {

  if (table === 'controls') body.appendChild(controlDrawerExtras(row));

  var foot = el('div', { class: 'dfoot' }, [

    el('span', { class: 'spacer' }),
    el('button', {
      class: 'act ghost danger', text: 'Delete',
      onclick: function () {
        if (!window.confirm('Delete ' + (row[L.ref] || 'this entry') + '?')) return;
        DB.tables[table] = rows(table).filter(function (r) { return r.id !== row.id; });
        save(); closeDrawer(); renderCurrentTab(); toast('Deleted', 'amber');
      }
    })
  ]);

  append(d, [head, body, foot]);
  document.body.classList.add('drawer-open');
  var tas = d.querySelectorAll('textarea');
  var sizeAll = function () { for (var i = 0; i < tas.length; i++) autosize(tas[i]); };
